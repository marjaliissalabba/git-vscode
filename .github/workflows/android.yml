name: Bygg Android-app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test kjernelogikk
        run: ./gradlew :core:test --console=plain

      - name: Bygg APK
        env:
          # Settes under Settings → Secrets and variables → Actions → Variables.
          # Uten disse bygges appen uten innlogging.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Last opp APK
        uses: actions/upload-artifact@v4
        with:
          name: SpinApp-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publiser som forhåndsversjon (lett å laste ned på telefonen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste-utvikling
          name: SpinApp – siste utviklingsversjon
          prerelease: true
          body: |
            Last ned `app-debug.apk` på Android-telefonen og åpne den for å installere.
            Bygget fra ${{ github.sha }} på ${{ github.ref_name }}.
          files: app/build/outputs/apk/debug/*.apk
